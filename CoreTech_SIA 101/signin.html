<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login | CoreTech</title>
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <main class="container narrow"><a class="brand" href="index.html"><img src="images/coretech-mark.svg"
                alt=""><span>Core</span>Tech</a>
        <section class="card" style="margin-top:32px">
            
            <h1 style="font-size:38px">Join us today!</h1>
            <p class="muted">Sign up now and enjoy exclusive perks! Create a free account today to get 10% off your first order, 
                earn rewards points on every purchase, and receive early access to sales.</p>
            <form id="login-form" class="checkout-form"><label>Email<input id="email" type="email"
                        required></label><label>Create your Password<input id="password" type="password" required></label><button
                    class="button">Sign Up</button>
                <p id="login-message" class="muted" aria-live="polite"></p>
            </form>
            <p class="muted">Admin: admin@CoreTech.com / admin123<br>Customer: customer@example.com / 123456</p>
        </section>
    </main>
    <script>document.getElementById('login-form').addEventListener('submit', e => { e.preventDefault(); const isAdmin = email.value.toLowerCase() === 'admin@coretech.com' && password.value === 'admin123'; const isCustomer = email.value.toLowerCase() === 'customer@example.com' && password.value === '123456'; if (isAdmin || isCustomer) { localStorage.setItem('coretech.demo.session.v1', JSON.stringify({ role: isAdmin ? 'admin' : 'customer' })); location.href = isAdmin ? 'admin/dashboard.html' : 'index.html' } else document.getElementById('login-message').textContent = 'Use one of the provided demo accounts.' })</script>
</body>

</html>
