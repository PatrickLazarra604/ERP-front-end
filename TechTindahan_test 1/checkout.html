<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Checkout | TechTindahan</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header><a class="logo" href="index.html">Tech<span>Tindahan</span></a></header>
    <main class="narrow">
        <p>CHECKOUT</p>
        <h1>Complete your order</h1>
        <form id="form" class="card"><label>Full Name<input required></label><label>Email<input type="email"
                    required></label><label>Phone<input required></label><label>Delivery Address<textarea
                    required></textarea></label><label>Payment<select>
                    <option>Cash on Delivery</option>
                    <option>GCash (Demo)</option>
                    <option>Bank Transfer (Demo)</option>
                </select></label>
            <h2 id="total"></h2><button class="btn">Place Order</button><small>Payment is only a frontend demo.</small>
        </form>
    </main>
    <script src="js/data.js"></script>
    <script src="js/customer.js"></script>
    <script>checkout()</script>
</body>

</html>
